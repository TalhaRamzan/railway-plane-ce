; Supervisor config for the lean Plane CE Railway image.
; Based on upstream deployments/aio/community/supervisor.conf (Plane v1.5.0).
; Differences from upstream:
;   - every program logs to stdout so Railway's log viewer shows it
;     (upstream writes to files under /app/logs only)
;   - the Celery worker pool is capped (PLANE_WORKER_CONCURRENCY)
;   - processes are exec'd so stop signals reach them
;   - a local SMTP -> HTTPS mail bridge and a crash watcher are added
;   - supervisorctl works (unix socket), e.g. `supervisorctl status`

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:migrator]
directory=/app/backend
command=sh -c "exec ./bin/docker-entrypoint-migrator.sh"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:mailbridge]
command=python3 /opt/plane-railway/mail_bridge.py
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=12

[program:space]
directory=/app/space/apps/space
command=sh -c "exec ./node_modules/.bin/react-router-serve ./build/server/index.js"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PORT="3002",HOSTNAME="0.0.0.0"
priority=15

[program:api]
directory=/app/backend
command=sh -c "exec ./bin/docker-entrypoint-api.sh"
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PORT="3004",HOSTNAME="0.0.0.0"
priority=15

[program:worker]
directory=/app/backend
command=sh -c "python manage.py wait_for_db && python manage.py wait_for_migrations && exec celery -A plane worker -l info --concurrency=${PLANE_WORKER_CONCURRENCY:-2} --max-memory-per-child=${PLANE_WORKER_MAX_MEMORY_KB:-393216} --without-gossip --without-mingle"
autostart=true
autorestart=true
startretries=10
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:beat]
directory=/app/backend
command=sh -c "exec ./bin/docker-entrypoint-beat.sh"
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:live]
command=sh -c "exec node /app/live/apps/live"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PORT="3005",HOSTNAME="0.0.0.0"
priority=20

[program:proxy]
directory=/app/proxy
command=sh -c "exec caddy run --config /app/proxy/Caddyfile"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

; Stops supervisord when a core program gives up (FATAL) so the container
; exits non-zero and Railway's restart policy brings it back cleanly.
[eventlistener:crashwatch]
command=python3 /opt/plane-railway/crashwatch.py
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
stdout_logfile=NONE
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
priority=1
